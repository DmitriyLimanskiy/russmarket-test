name: russmarket-test

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - type: bind
        source: ./models
        target: /models
        read_only: true
        bind:
          create_host_path: false
    command:
      - --model
      - /models/Qwen3.5-9B-Q4_K_M.gguf
      - --alias
      - qwen-local
      - --ctx-size
      - "4096"
      - --host
      - 0.0.0.0
      - --port
      - "1234"
